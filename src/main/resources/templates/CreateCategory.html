<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Category </title>
    <style>
        body {
            background-color: #8f9779;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }

        h1 {
            color:  #3E3A36;
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }

        form {
            background-color: #F5E6D3;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
            position: relative;
            z-index: 1;
            border: 3px solid #ffffff;
            margin: 20px 0;
        }

        label {
            font-size: 1.2em;
            font-weight: bold;
            color:  #3E3A36;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            padding: 15px;
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            background-color: #ffffff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color:  #38573E;
            color: white;
            font-size: 1.2em;
            border: none;
            padding: 15px 25px;
            border-radius: 20px;
            margin-top: 30px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: rgba(34, 139, 34, 0.5);
            transform: scale(1.1);
        }

        a {
            display: inline-block;
            font-size:20px;
            margin: 10px 0;
            color: #2D3127;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            color: #8f9779;
        }


        /* Responsive adjustments */
        @media (max-width: 600px) {
            form {
                padding: 20px;
            }
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }
    </style>
</head>
<body>

<h1>Category Information</h1>

<form id="categoryForm" th:action="@{/categories/save}" th:object="${category}" method="POST" >
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="name">Category Name:</label><br>
        <input type="text" name="name" id="name" required
               pattern="[A-Za-z ]{1,50}"
               title="Category name should only contain letters and be between 1 to 50 characters long." placeholder="e.g. Groceries, Rent, Salary"/>
        <div id="categoryNameError"></div>
    </div>
    <br>

    <div class = "radio-group">
        <p>Select Type</p>
        <input type="radio" id="income" name="type" value="INCOME" required>
        <label for="income">Income</label><br>
        <input type="radio" id="expense" name="type" value="EXPENSE" required>
        <label for="expense">Expense</label><br>
    </div>
    <br>
    <input type="hidden" th:field="*{user.id}" />
    <input type="hidden" name="user.id" th:value="${user.id}" />
    <button type="submit">Submit</button>
    <br>
    <a th:href="@{/user/dashboard}" class="dashboard-btn">Return to Dashboard</a>
</form>

</body>
</html>
