<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transactions List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFEBCD;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #2D3127;
        }
        a {
            display: inline-block;
            margin: 10px 0;
            color: #2D3127;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
        }
        a:hover {
            text-decoration: underline;
            color: #8f9779;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #6B705C; /* earthy green-brown */
            color: white;
        }
        td {
            background-color: #FAFAD2;
        }
        td a {
            color: black;
        }
        td a:hover {
            color: #333;
        }
        tr:hover {
            background-color: #F0E68C;
        }

    </style>
</head>
<body>
<h1>Transactions</h1>
<a th:href="@{/transactions/new}">Create New Transaction</a>
<br>


<a th:href="@{/user/dashboard}" class="dashboard-btn">Return to Dashboard</a>
<br>
<form>
<!-- Category Filter -->
<label>Category:</label>
<select name="categoryId">
    <option value="">All</option>
    <option th:each="cat : ${categories}"
            th:value="${cat.id}"
            th:text="${cat.name}">
    </option>
</select>

<!-- Type Filter -->
<label>Type:</label>
<select name="type">
    <option value="">All</option>
    <option value="INCOME">Income</option>
    <option value="EXPENSE">Expense</option>
</select>
    <!-- Amount Filter -->
    <input type="number" step="0.01" name="minAmount" placeholder="Min Amount">
    <input type="number" step="0.01" name="maxAmount" placeholder="Max Amount">


<!-- Date Range -->
<label>From:</label>
<input type="date" name="startDate">

<label>To:</label>
<input type="date" name="endDate">

<button type="submit">Filter</button>
    <a th:href="@{/transactions/view}">Reset Filters</a>
</form>

<br>
<table>
    <thead>
    <tr>
        <th>Date</th>
        <th>Title</th>
        <th>Category</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.transactionDate}">Transaction Date</td>
        <td th:text="${transaction.title}">Transaction Title</td>
        <td th:text="${transaction.category.name}">Assigned Category</td>
        <td th:text="${transaction.type}">Transaction Type</td>
        <td th:text="${transaction.type.name() == 'EXPENSE'
    ? '- $' + #numbers.formatDecimal(transaction.amount, 1, 2)
    : '+ $' + #numbers.formatDecimal(transaction.amount, 1, 2)}">
        </td>
        <td>
        <a th:href="@{/transactions/edit/{id}(id=${transaction.id})}">Edit</a>
            |
        <a th:href="@{/transactions/delete/{id}(id=${transaction.id})}">Delete</a>
        </td>
    </tr>

    </tbody>
</table>

</body>
</html>
