<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>LeafTrack - SignUp</title>
</head>
<style>
    body {
        background: linear-gradient(135deg, #2f4f3e, #4d5d53);
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        overflow-y: auto;
        position: relative;
    }

    h1 {
        color:  #f4f4f4;
        text-align: center;
        font-size: 3em;
        margin-bottom: 20px;
        animation: bounce 1s ease-in-out;
    }

    p{
        color: #2D3127;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-30px);
        }
        60% {
            transform: translateY(-15px);
        }
    }

    form {
        background-color: #78866b;
        padding: 40px 60px;
        border: 2px solid rgba(255,255,255,0.4);
        border-radius: 10px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        text-align: center;
        width: 350px;
        position: relative;
        z-index: 1;
        margin: 20px 0;
    }

    label {
        font-size: 1.2em;
        color: white;
    }

    input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
        padding: 15px;
        margin-top: 10px;
        width: 100%;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        background-color: #ffffff;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
    }

    button {
        background-color: #38573E;
        color: white;
        font-size: 1.2em;
        font-weight: bold;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        margin-top: 20px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.3s;
    }

    button:hover {
        background-color: #8f9779;
        transform: scale(1.1);
    }


    .additional-links {
        margin-top: 20px;
        text-align: center;
    }

    .additional-links a {
        color: #e6e6e6;
        text-decoration: none;
        font-size: 1em;
        display: block;
        margin-top: 10px;
    }

    .additional-links a:hover {
        text-decoration: underline;
        color: #8f9779;
    }
</style>
<body>



<form id="signupForm" th:action="@{/register}" th:object="${user}" method="POST">
    <h1>SignUp Here</h1>
    <p>Please fill in this form to create an account.</p>
    <hr>

    <div>
        <label for="fname">First Name:</label>
        <input type="text" name="firstName" id="fname" required />
        <div id="error"></div>
    </div>
    <br>
    <div>
        <label for="lname">Last Name:</label>
        <input type="text" name="lastName" id="lname" required />
        <div id="error1"></div>
    </div>

    <div>
        <label for="email">Email:</label><br>
        <input type="text" name="email" id="email" required
               pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
               title="Has to be valid Email"/>
        <div id="error2"></div>
    </div>

    <div>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" name="phoneNumber" id="phone" required
               pattern="[0-9]{10}"
               title="Phone number must be 10 digits" />
        <div id="errorPhone"></div>
    </div>

    <div>
        <label for="pid">Password:</label><br>
        <input type="password" th:field="*{password}" id="pid" required
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Must contain at least one number, one uppercase, and one lowercase letter, and be at least 8 characters long" />
        <div id="error3"></div>
    </div>
    <br>

    <div>
        <label for="prid">Confirm Password:</label>
        <input type="password" id="prid" th:field="*{confirmPassword}" required
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Must match original password"/>
        <div id="error4"></div>
    </div>
    <br>

    <div>
        <label for="birthday">Birthday:</label>
        <input type="date" name="dateOfBirth" id="birthday" required />
        <div id="error5"></div>
        <div id="days"></div>
    </div>

    <button type="submit">Create Account</button>
    <div class="additional-links">
        <a class="active" href="#" th:href="@{/login}" onclick="goToLoginPage()">Already have an account? Log In</a>
    </div>

</form>

<script>


    function goToLoginPage() {
        location.href = "UserLogin.html";
    }


    document.getElementById('signupForm').addEventListener('submit', function(event) {
        var isValid = verifyFields() && verifyFields1() && verifyFields2() && verifyFields4() && verifyFields5() && verifyFields6() && verifyPhone();

        if (!isValid) {
            event.preventDefault();
        } else {
            dateDiff(); // If everything is valid, show the age calculation
        }
    });

    function verifyFields() {
        var fname = document.getElementById("fname").value;
        if (fname === "") {
            document.getElementById("error").innerHTML = "Invalid First Name";
            return false;
        } else {
            document.getElementById("error").innerHTML = "";
            return true;
        }
    }

    function verifyFields1() {
        var lname = document.getElementById("lname").value;
        if (lname === "") {
            document.getElementById("error1").innerHTML = "Invalid Last Name";
            return false;
        } else {
            document.getElementById("error1").innerHTML = "";
            return true;
        }
    }

    function verifyFields2() {
        var email = document.getElementById("email").value;
        var pattern = /^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/;

        if (!pattern.test(email)) {
            document.getElementById("error2").innerHTML = "Invalid Email";
            return false;
        } else {
            document.getElementById("error2").innerHTML = "";
            return true;
        }
    }

    function verifyPhone() {
        var phone = document.getElementById("phone").value;
        var phonePattern = /^[0-9]{10}$/;

        if (!phonePattern.test(phone)) {
            document.getElementById("errorPhone").innerHTML = "Invalid Phone Number";
            return false;
        } else {
            document.getElementById("errorPhone").innerHTML = "";
            return true;
        }
    }



    function verifyFields4() {
        var pid = document.getElementById("pid").value;
        if (pid.length < 8 || !/[A-Z]/.test(pid) || !/[a-z]/.test(pid) || !/[0-9]/.test(pid)) {
            document.getElementById("error3").innerHTML = "Invalid Password";
            return false;
        } else {
            document.getElementById("error3").innerHTML = "";
            return true;
        }
    }

    document.getElementById("prid").addEventListener("blur", verifyFields5);



    function verifyFields5() {
        var input = document.getElementById('pid');
        if (input.value != document.getElementById('prid').value) {
            document.getElementById("error4").innerHTML = "Passwords do not match";
            return false;
        } else {
            document.getElementById("error4").innerHTML = "";
            return true;
        }
    }

    function verifyFields6() {
        var birthday = document.getElementById("birthday").value;
        if (birthday === "") {
            document.getElementById("error5").innerHTML = "Invalid Birthday";
            return false;
        } else {
            document.getElementById("error5").innerHTML = "";
            return true;
        }
    }

</script>
</body>
</html>
