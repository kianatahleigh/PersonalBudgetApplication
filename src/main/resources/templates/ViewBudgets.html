<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Budget</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFEBCD;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #3E3A36;
        }
        h3{
            font-size: 20px;
        }
        a {
            display: inline-block;
            margin: 10px 0;
            color: #2D3127;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            color: #8f9779;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #6B705C; /* earthy green-brown */
            color: white;
        }
        td {
            background-color: #FAFAD2;
        }
        td a {
            color:  #6B705C;
        }
        td a:hover {
            color: #333;
        }
        tr:hover {
            background-color: #F0E68C;
        }

        label{
            font-size: 1em;
            font-weight: bold;
        }

        select {
            width: auto;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            background-color: #ffffff;
            font-family:  'Arial', sans-serif;
        }

        form{
            background-color: #A3B18A;
            border: 2px solid rgba(255,255,255,0.4);

            width: auto;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
        }
        button {
            background-color: #6B705C;
            color: white;
            font-family: 'Arial', sans-serif;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #A5A58D;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<header>
    <h1 th:text="'Details for ' + ${budget.name} + ' ' + 'Budget'"></h1>
</header>

<label>Budget Name:</label>
<p th:text="${budget.name}"></p>
<label>Total Amount:</label>
<p th:text="'$' + ${#numbers.formatDecimal(budget.amount, 1, 2)}"></p>
<label>Start Date: </label>
<p th:text="${budget.startDate}"></p>
<label>End Date: </label>
<p th:text="${budget.endDate}"></p>


<form th:action="@{/budgetcategories/add}" method="post">

    <h3>Add Category to Budget</h3>

    <input type="hidden" name="budgetId" th:value="${budget.id}" />

    <label for="category">Choose Category:</label>
    <select id="category" name="categoryId">
        <option value="" disabled selected> Select a Category</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}"></option>
    </select>

    <div class="input-group">
        <label for="allocatedAmount">Allocated Amount ($):</label>
        <input type="number" id="allocatedAmount" name="allocatedAmount" placeholder="e.g. 100.00" step="0.01" min="0">
    </div>
    <button type="submit">Add</button>
</form>

<section>
    <div>
        <h2>Budget Details</h2>

        <table>
            <thead>
            <tr>
                <th>Category</th>
                <th>Allocated Amount</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="budgetcategory : ${budget.budgetCategories}">
                <td th:text="${budgetcategory.category.name}">Category</td>
                <td th:text="'$' + ${#numbers.formatDecimal(budgetcategory.allocatedAmount, 1, 2)}">
                    Allocated Amount
                </td>
                <td>
                    <a th:href="@{/budgetcategories/edit/{id}(id=${budgetcategory.id})}">Edit</a>
                    |
                    <a th:href="@{/budgetcategories/delete/{id}(id=${budgetcategory.id})}"
                    onclick="return confirm('Are you sure you want to delete this category?')">Delete</a>

                </td>
            </tr>
            </tbody>
        </table>

        <div>
            <a th:href="@{/budgets/new}">Create New Budget</a>
        </div>
    </div>
</section>

<footer>
    <a th:href="@{/user/dashboard}">Back to Dashboard</a>
</footer>
</body>
</html>
