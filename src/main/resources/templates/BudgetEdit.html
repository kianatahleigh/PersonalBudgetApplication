<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Budget Category</title>

    <style>

        h1 {
            color:  #f4f4f4;;
        }

        body {
            font-family:  'Arial', sans-serif;
            background: #2F3E2C;
            padding: 20px;
        }

        form {
            margin-top: 20px;
            background-color:#F5E6D3;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        select {
            width: auto;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            background-color: #ffffff;
            font-family:  'Arial', sans-serif;
        }

        button {
            background-color: #6B705C;
            color: white;
            font-family: 'Arial', sans-serif;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #A5A58D;
            transform: scale(1.1);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        label, p {
            color: #3E3A36;
        }

        a {
            color: #8f9779;
            text-decoration: none;
            margin-top: 15px;
            display: inline-block;
            font-size: 20px;
        }
        a:hover {
            text-decoration: underline;
            color: #2D3127;

        }
    </style>
</head>
<body>

<h1>Edit Budget Category</h1>

<form th:action="@{/budgetcategories/update}" th:object="${budgetCategory}" method="post">

    <input type="hidden" name="id" th:value="${budgetCategory.id}" />

    <label for="category">Choose Category</label>
    <select id="category" name="categoryId">
        <option value="" disabled selected> Select a Category</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}"></option>
    </select>

    <div class="input-group">
        <label for="allocatedAmount">Allocated Amount ($)</label>
        <input type="number" id="allocatedAmount" name="allocatedAmount" placeholder="e.g. 100.00" step="0.01" min="0">
    </div>

    <button type="submit">Update</button>

   <div> <a th:href="@{/user/dashboard}" class="dashboard-btn">Return to Dashboard</a></div>

</form>


</body>
</html>
